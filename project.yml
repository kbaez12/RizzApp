name: RizzApp

options:
  bundleIdPrefix: com.zenomedia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  # Only third-party dependency in the project.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0

targets:
  RizzApp:
    type: application
    platform: iOS
    sources:
      - RizzApp
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        # Must exactly match the App Store Connect app record.
        PRODUCT_BUNDLE_IDENTIFIER: com.zenomedia.greenshot
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Greenshot
        # Only standard HTTPS/TLS is used (exempt from export compliance).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: true
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1

  RizzAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RizzAppTests
    dependencies:
      - target: RizzApp

# Explicit scheme so Codemagic/xcodebuild can find it after `xcodegen generate`.
schemes:
  RizzApp:
    build:
      targets:
        RizzApp: all
        RizzAppTests: [test]
    test:
      targets:
        - RizzAppTests
