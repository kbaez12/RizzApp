# Codemagic is the Mac for this repo (no local Xcode).
# This workflow: generate the .xcodeproj → compile → run unit tests →
# save an unsigned simulator .app. No Apple signing required.
#
# It does NOT give you a tappable iPhone UI. For that you need a later
# signed TestFlight workflow (Apple Developer account + certificates).
#
# In Codemagic: Apps → add this GitHub repo → use this yaml → start
# the "iOS compile + tests" workflow.

workflows:
  ios-compile-and-test:
    name: iOS compile + tests
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project RizzApp.xcodeproj \
            -scheme RizzApp

      - name: Compile for simulator
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          DESTINATION=$(
            xcrun simctl list devices available \
              | awk -F '[()]' '/iPhone/ && !found {print $1; found=1}' \
              | sed 's/^ *//;s/ *$//'
          )
          echo "Using simulator: $DESTINATION"

          LOG_DIR=/tmp/xcodebuild_logs
          LOG_FILE="$LOG_DIR/compile.log"
          mkdir -p "$LOG_DIR"

          set +e
          xcodebuild build \
            -project RizzApp.xcodeproj \
            -scheme RizzApp \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$LOG_FILE"
          XCODEBUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$XCODEBUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "==================== COMPILER DIAGNOSTICS ===================="
            echo "xcodebuild exited with status $XCODEBUILD_STATUS"
            echo "Lines matching 'error:' / 'fatal error:' (with context):"
            echo "--------------------------------------------------------------"
            grep -n -E -B 4 -A 6 '(fatal )?error:' "$LOG_FILE" | head -n 400 || true
            echo ""
            echo "==================== LAST 100 LINES OF LOG ===================="
            tail -n 100 "$LOG_FILE" || true
            echo "==============================================================="
            echo "Full log: $LOG_FILE"
            exit "$XCODEBUILD_STATUS"
          fi

      - name: Run unit tests
        script: |
          set -euo pipefail
          DESTINATION=$(
            xcrun simctl list devices available \
              | awk -F '[()]' '/iPhone/ && !found {print $1; found=1}' \
              | sed 's/^ *//;s/ *$//'
          )
          xcodebuild test \
            -project RizzApp.xcodeproj \
            -scheme RizzApp \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$DESTINATION" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Test/**/*.xcresult
