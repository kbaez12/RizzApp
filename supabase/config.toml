# Supabase project configuration (minimal). Running `supabase init` on a
# machine with the CLI will expand this; keep the [functions.*] sections.
project_id = "rizzapp"

# Required for POST /auth/v1/signup with an empty JSON body (anonymous
# sign-in). Hosted projects must enable the same dashboard toggle.
[auth]
enable_anonymous_sign_ins = true

# @supabase/server validates user JWTs inside app-facing functions. Gateway
# verification stays off so that package can provide consistent JSON 401s and
# CORS behavior. RevenueCat uses its own server-to-server credential.

[functions.generate]
verify_jwt = false

[functions.usage]
verify_jwt = false

[functions.analyze]
verify_jwt = false

[functions.subscription-sync]
verify_jwt = false

# Called by RevenueCat, not by our app: authenticated with a shared secret
# in the Authorization header (see REVENUECAT_WEBHOOK_SECRET).
[functions.revenuecat-webhook]
verify_jwt = false
